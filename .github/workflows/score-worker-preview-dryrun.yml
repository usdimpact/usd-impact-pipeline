name: Score isolated Worker Preview dry-run (no deployment)

on:
  pull_request:
    branches: [main]
    paths:
      - 'workers/score-preview/**'
      - 'security/score-public-paths.mjs'
      - 'security/score-ticket-form.mjs'
      - 'security/score-preview-worker.test.mjs'
      - 'public/.assetsignore'
      - '.github/workflows/score-worker-preview-dryrun.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Test isolated Worker security contracts
        run: node --test security/score-preview-worker.test.mjs
      - name: Bundle with pinned Wrangler (offline from Cloudflare management; NO deploy)
        run: |
          set -euo pipefail
          npx --yes wrangler@4.135.0 deploy --dry-run \
            --config workers/score-preview/wrangler.jsonc \
            --outdir "$RUNNER_TEMP/score-worker-bundle"
          echo "Workers Preview bundle generated; no Cloudflare deployment or secret accessed."
