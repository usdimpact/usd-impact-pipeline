name: Score v2 reproduction attestation

# Read-only verification on relevant pull requests and after relevant changes
# land on main. Pull-request runs are pre-merge evidence only; a strict release
# becomes a production acceptance candidate only on a successful push-to-main
# attestation. This workflow never regenerates, commits, pushes, merges, or
# deploys content.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'public/data/usd_impact_score_v2.json'
      - 'public/data/score_repro_bundle_latest.json'
      - 'public/archive/**/repro_bundle.json'
      - 'public/data/score_v2_methodology.json'
      - 'public/data/score_v2_methodology.schema.json'
      - 'requirements.lock'
      - 'scripts/validate_weekly_release.py'
      - 'scripts/validate_methodology_contract.py'
      - 'scripts/post_merge_repro_attestation.py'
      - '.github/workflows/repro-attestation.yml'
  push:
    branches: [main]
    paths:
      - 'public/data/usd_impact_score_v2.json'
      - 'public/data/score_repro_bundle_latest.json'
      - 'public/archive/**/repro_bundle.json'
      - 'public/data/score_v2_methodology.json'
      - 'public/data/score_v2_methodology.schema.json'
      - 'requirements.lock'
      - 'scripts/validate_weekly_release.py'
      - 'scripts/validate_methodology_contract.py'
      - 'scripts/post_merge_repro_attestation.py'
      - '.github/workflows/repro-attestation.yml'

permissions:
  contents: read

concurrency:
  group: score-v2-repro-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  attest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full attested Git history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Verify methodology contract against production code
        run: python -m scripts.validate_methodology_contract --json

      - name: Attest checked-out reproduction evidence
        run: |
          python -m scripts.post_merge_repro_attestation \
            --root . \
            --report "$RUNNER_TEMP/score-v2-repro-attestation.json"

      - name: Record attestation in job summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/score-v2-repro-attestation.json" ]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'score-v2-repro-attestation.json').read_text())
          print('## Score v2 reproduction attestation')
          print('')
          print(f"- Context: **{report['attestation_context']}**")
          print(f"- Status: **{report['status']}**")
          print(f"- Score week: `{report['score_week']}`")
          print(f"- Attested Git SHA: `{report['attested_git_sha']}`")
          print(f"- Methodology contract SHA-256: `{report['methodology_contract_sha256']}`")
          print(f"- Strict bundle required: **{report['strict_bundle_required']}**")
          print(f"- Production acceptance candidate: **{report['acceptance_candidate']}**")
          if report.get('strict_bundle_required'):
              print(f"- Offline reproduction gate: **{report['offline_reproduction_gate']}**")
              print(f"- Bundle/archive match: **{report['bundle_archive_match']}**")
              print(f"- Bundle pipeline SHA is attested ancestor: **{report['bundle_pipeline_sha_is_attested_ancestor']}**")
              print(f"- Bundle SHA-256: `{report['bundle_sha256']}`")
          else:
              print(f"- Note: {report['note']}")
          PY
          else
            echo '## Score v2 reproduction attestation' >> "$GITHUB_STEP_SUMMARY"
            echo '' >> "$GITHUB_STEP_SUMMARY"
            echo '**FAILED before an attestation report was produced.**' >> "$GITHUB_STEP_SUMMARY"
          fi
