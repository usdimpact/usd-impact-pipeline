name: Weekly USD Impact Score

# Runs the score, commentary, archive, and dashboard pipeline every Friday at
# 22:00 UTC. A generated release is merged only after the exact publication
# commit passes the Weekly score quality workflow. Cloudflare Pages then
# auto-deploys the validated main-branch commit.
#
# Manual runs: Actions tab → Weekly USD Impact Score → Run workflow.

on:
  schedule:
    - cron: '0 22 * * 5'  # Friday 22:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: weekly-usd-impact
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run score pipeline
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python usd_impact_score_v2.py --web --output-dir public --backtest

      - name: Generate weekly commentary and bridge data
        run: |
          python scripts/generate_weekly_commentary.py \
            --score-json public/data/usd_impact_score_v2.json \
            --commentary-dir commentary \
            --bridge-dir data \
            --public-data-dir public/data

      - name: Rebuild dashboards with current commentary
        run: |
          python scripts/rerender_dashboard.py \
            --csv public/data/usd_impact_score_v2.csv \
            --output-dir public

      - name: Show latest score
        run: |
          python -c "
          import json
          with open('public/data/usd_impact_score_v2.json') as f:
              meta = json.load(f)['metadata']
          print(f\"Latest score: {meta['latest_score']:+.3f}\")
          print(f\"Latest regime: {meta['latest_regime']}\")
          print(f\"As of: {meta['latest_date']}\")
          print(f\"Total weeks: {meta['n_weeks']}\")
          "

      - name: Archive weekly snapshot
        run: |
          WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
          mkdir -p public/archive/$WEEK
          cp public/en/index.html public/archive/$WEEK/en.html
          cp public/es/index.html public/archive/$WEEK/es.html
          cp public/data/usd_impact_score_v2.json public/archive/$WEEK/score.json
          cp public/data/weekly_input_latest.json public/archive/$WEEK/weekly_input.json
          echo "Archived score, commentary dashboard, and bridge data to public/archive/$WEEK/"

      - name: Validate generated weekly release
        run: python scripts/validate_weekly_release.py

      - name: Open, validate, and merge weekly publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public commentary data)" ]; then
            echo "No weekly score changes to publish."
            exit 0
          fi

          WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
          branch="automation/weekly-usd-impact-${WEEK}-${GITHUB_RUN_ID}"

          git config user.name "USD Impact Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git checkout -b "$branch"
          git add public commentary data
          git commit -m "Publish Weekly USD Impact Score for ${WEEK}"
          git push --set-upstream origin "$branch"
          head_sha="$(git rev-parse HEAD)"

          cat > "$RUNNER_TEMP/weekly-score-pr.md" <<EOF
          ## Automated Weekly USD Impact Score publication

          This pull request contains the generated score, deterministic English and Spanish commentary, bridge data, dashboards, and dated archive for **${WEEK}**.

          Publication is automatic only after the Weekly score quality workflow passes on this exact commit. A failed consistency check leaves this pull request open and does not change the Cloudflare Pages production deployment.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Publish Weekly USD Impact Score — ${WEEK}" \
            --body-file "$RUNNER_TEMP/weekly-score-pr.md")"

          gh workflow run quality.yml --ref "$branch"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow quality.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Could not locate the dispatched Weekly score quality run for $head_sha."
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_url" --squash --delete-branch
          echo "Merged Weekly USD Impact Score for ${WEEK}. Cloudflare Pages production deployment will follow from main."
