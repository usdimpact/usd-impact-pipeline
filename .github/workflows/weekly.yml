name: Weekly USD Impact Score

# Runs the score, commentary, archive, and dashboard pipeline every Friday at
# 22:00 UTC. Cloudflare Pages auto-deploys after the generated files are pushed.
#
# Manual runs: Actions tab → Weekly USD Impact Score → Run workflow.

on:
  schedule:
    - cron: '0 22 * * 5'  # Friday 22:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run score pipeline
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python usd_impact_score_v2.py --web --output-dir public --backtest

      - name: Generate weekly commentary and bridge data
        run: |
          python scripts/generate_weekly_commentary.py \
            --score-json public/data/usd_impact_score_v2.json \
            --commentary-dir commentary \
            --bridge-dir data \
            --public-data-dir public/data

      - name: Rebuild dashboards with current commentary
        run: |
          python scripts/rerender_dashboard.py \
            --csv public/data/usd_impact_score_v2.csv \
            --output-dir public

      - name: Validate generated commentary
        run: |
          python - <<'PY'
          from pathlib import Path

          required = [
              Path('commentary/latest_en.md'),
              Path('commentary/latest_es.md'),
              Path('public/en/index.html'),
              Path('public/es/index.html'),
              Path('public/data/weekly_input_latest.json'),
          ]
          missing = [str(path) for path in required if not path.exists() or path.stat().st_size == 0]
          if missing:
              raise SystemExit(f'Missing generated outputs: {missing}')

          en = Path('public/en/index.html').read_text(encoding='utf-8')
          es = Path('public/es/index.html').read_text(encoding='utf-8')
          if 'Automated Regime Commentary' not in en:
              raise SystemExit('English commentary was not rendered into the dashboard.')
          if 'Comentario Automático de Régimen' not in es:
              raise SystemExit('Spanish commentary was not rendered into the dashboard.')
          print('Commentary outputs and dashboard rendering validated.')
          PY

      - name: Show latest score
        run: |
          python -c "
          import json
          with open('public/data/usd_impact_score_v2.json') as f:
              meta = json.load(f)['metadata']
          print(f\"Latest score: {meta['latest_score']:+.3f}\")
          print(f\"Latest regime: {meta['latest_regime']}\")
          print(f\"As of: {meta['latest_date']}\")
          print(f\"Total weeks: {meta['n_weeks']}\")
          "

      - name: Archive weekly snapshot
        run: |
          WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
          mkdir -p public/archive/$WEEK
          cp public/en/index.html public/archive/$WEEK/en.html
          cp public/es/index.html public/archive/$WEEK/es.html
          cp public/data/usd_impact_score_v2.json public/archive/$WEEK/score.json
          cp public/data/weekly_input_latest.json public/archive/$WEEK/weekly_input.json
          echo "Archived score, commentary dashboard, and bridge data to public/archive/$WEEK/"

      - name: Commit and push weekly update
        run: |
          git config user.name "USD Impact Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git add public/ commentary/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
            git commit -m "Weekly score and commentary update — $WEEK"
            git push
            echo "Pushed weekly score and commentary update for $WEEK"
          fi
