name: Weekly USD Impact Score

# Runs the score, commentary, archive, and dashboard pipeline every Friday at
# 22:00 UTC. A generated release remains open for protected human review only
# after the exact publication commit passes both Weekly score quality and the
# read-only reproduction attestation. A separately authorized merge lets
# Cloudflare Pages deploy the validated main commit.
#
# Manual runs: Actions tab → Weekly USD Impact Score → Run workflow.

on:
  schedule:
    - cron: '0 22 * * 5'  # Friday 22:00 UTC
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: weekly-usd-impact
  cancel-in-progress: false

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Run score pipeline
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python usd_impact_score_v2.py \
            --web \
            --output-dir public \
            --backtest \
            --weekly-levels-output "$RUNNER_TEMP/score-v2-weekly-levels.csv" \
            --provider-evidence-output "$RUNNER_TEMP/score-v2-provider-evidence.json"

      - name: Freeze and verify score reproduction bundle
        run: |
          python -m scripts.build_score_repro_bundle \
            --score-json public/data/usd_impact_score_v2.json \
            --weekly-levels "$RUNNER_TEMP/score-v2-weekly-levels.csv" \
            --provider-evidence "$RUNNER_TEMP/score-v2-provider-evidence.json" \
            --output public/data/score_repro_bundle_latest.json

      - name: Generate weekly commentary and bridge data
        run: |
          python scripts/generate_weekly_commentary.py \
            --score-json public/data/usd_impact_score_v2.json \
            --commentary-dir commentary \
            --bridge-dir data \
            --public-data-dir public/data

      - name: Rebuild dashboards with current commentary
        run: |
          python scripts/rerender_dashboard.py \
            --csv public/data/usd_impact_score_v2.csv \
            --output-dir public

      - name: Show latest score
        run: |
          python -c "
          import json
          with open('public/data/usd_impact_score_v2.json') as f:
              meta = json.load(f)['metadata']
          print(f\"Latest score: {meta['latest_score']:+.3f}\")
          print(f\"Latest regime: {meta['latest_regime']}\")
          print(f\"As of: {meta['latest_date']}\")
          print(f\"Total weeks: {meta['n_weeks']}\")
          for driver, source in meta['source_provenance'].items():
              print(
                  f\"{driver}: {source['provider']} {source['series']} | \"
                  f\"observation {source['observation_date']} | \"
                  f\"age {source['age_days']}/{source['max_age_days']} days\"
              )
          "

      - name: Archive weekly snapshot
        run: |
          WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
          mkdir -p public/archive/$WEEK
          cp public/en/index.html public/archive/$WEEK/en.html
          cp public/es/index.html public/archive/$WEEK/es.html
          cp public/data/usd_impact_score_v2.json public/archive/$WEEK/score.json
          cp public/data/weekly_input_latest.json public/archive/$WEEK/weekly_input.json
          cp public/data/score_repro_bundle_latest.json public/archive/$WEEK/repro_bundle.json
          echo "Archived score, commentary dashboard, bridge data, and reproduction bundle to public/archive/$WEEK/"

      - name: Rebuild weekly archive indexes
        run: python scripts/generate_weekly_archive_index.py

      - name: Validate generated weekly release
        run: python scripts/validate_weekly_release.py

      - name: Open and validate weekly publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public commentary data)" ]; then
            echo "No weekly score changes to publish."
            exit 0
          fi

          WEEK=$(python -c "import json; print(json.load(open('public/data/usd_impact_score_v2.json'))['metadata']['latest_date'])")
          branch="automation/weekly-usd-impact-${WEEK}-${GITHUB_RUN_ID}"

          git config user.name "USD Impact Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git checkout -b "$branch"
          git add public commentary data
          git commit -m "Publish Weekly USD Impact Score for ${WEEK}"
          git push --set-upstream origin "$branch"
          head_sha="$(git rev-parse HEAD)"

          cat > "$RUNNER_TEMP/weekly-score-pr.md" <<EOF
          ## Automated Weekly USD Impact Score publication

          This pull request contains the generated score, deterministic English and Spanish commentary, bridge data, dashboards, dated archive, and immutable score-reproduction evidence for **${WEEK}**.

          The exact publication commit must pass both the Weekly score quality workflow and the read-only Score v2 reproduction attestation. The workflow then stops with the pull request open for protected human review. A failed gate leaves the pull request open and does not change the Cloudflare Pages production deployment.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Publish Weekly USD Impact Score — ${WEEK}" \
            --body-file "$RUNNER_TEMP/weekly-score-pr.md")"

          gh workflow run quality.yml --ref "$branch"

          quality_run_id=""
          for attempt in $(seq 1 30); do
            quality_run_id="$(gh run list \
              --workflow quality.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            if [ -n "$quality_run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$quality_run_id" ]; then
            echo "Could not locate the dispatched Weekly score quality run for $head_sha."
            exit 1
          fi

          gh run watch "$quality_run_id" --exit-status

          # Run the same frozen-bundle attestation on the exact publication
          # branch before protected review. workflow_dispatch is intentionally
          # a read-only context and can never claim production acceptance.
          gh workflow run repro-attestation.yml --ref "$branch"

          attestation_run_id=""
          for attempt in $(seq 1 30); do
            attestation_run_id="$(gh run list \
              --workflow repro-attestation.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            if [ -n "$attestation_run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$attestation_run_id" ]; then
            echo "Could not locate the dispatched Score v2 reproduction attestation for $head_sha."
            exit 1
          fi

          gh run watch "$attestation_run_id" --exit-status
          echo "Weekly USD Impact Score ${WEEK} passed exact-head quality and reproduction attestation."
          echo "Protected human review and a separately authorized merge remain required: $pr_url"
