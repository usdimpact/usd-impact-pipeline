name: TEMP Score v3 pre-holdout no-write rehearsal

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rehearse:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout proposed Score v3 workflow state
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Revalidate current release and metric contracts
        run: |
          python -m scripts.validate_methodology_contract --json
          python scripts/validate_weekly_release.py
          python -m scripts.score_v3_metrics --mode readiness

      - name: Prove current pre-holdout path performs zero writes
        run: |
          before_manifest="$(sha256sum research/score_v3_prospective_manifest.json | awk '{print $1}')"
          before_status="$(git status --porcelain)"
          if [ -n "$before_status" ]; then
            echo "Working tree was not clean before rehearsal:"
            echo "$before_status"
            exit 1
          fi

          python -m scripts.score_v3_shadow_ingestion \
            --attestation-run-id 0 \
            --attestation-url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --report "$RUNNER_TEMP/score-v3-preholdout.json"

          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ['RUNNER_TEMP'], 'score-v3-preholdout.json').read_text())
          assert report['published_week'] == '2026-08-21', report
          assert report['status'] == 'pre_holdout_noop', report
          assert report['research_only'] is True, report
          assert report['writes_performed'] is False, report
          PY

          after_manifest="$(sha256sum research/score_v3_prospective_manifest.json | awk '{print $1}')"
          test "$before_manifest" = "$after_manifest"
          test ! -d research/prospective
          test -z "$(git status --porcelain)"

      - name: Record rehearsal summary
        run: |
          echo '## Score v3 pre-holdout rehearsal' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '- Published week: `2026-08-21`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Status: **pre_holdout_noop**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Repository writes: **false**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Prospective checkpoint output: **none**' >> "$GITHUB_STEP_SUMMARY"
          echo '- Production Score v2 impact: **none**' >> "$GITHUB_STEP_SUMMARY"
