name: Cloudflare Pages security posture

on:
  push:
    branches: [main]
    paths:
      - 'public/_headers'
      - 'functions/_middleware.js'
      - 'security/score-public-paths.mjs'
      - 'scripts/check_score_pages_security_posture.py'
      - '.github/workflows/pages-security-posture.yml'
  schedule:
    - cron: '53 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout read-only security monitor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify public-only Score Pages perimeter on both origins
        shell: bash
        run: |
          set -euo pipefail
          # Operational status and headers only: never fetch public component data.
          # Premium HTML intentionally returns 403 on Cloudflare Pages.
          # Retired redemption returns 410; public methodology metadata HEAD is 200.
          python3 -m scripts.check_score_pages_security_posture
