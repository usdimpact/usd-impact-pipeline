name: Score private evidence synthetic write rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: score-private-evidence-synthetic-write
  cancel-in-progress: false

jobs:
  synthetic-write:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Confirm rights HOLD remains active
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(Path("governance/score-publication-rights-gate.json").read_text())
          surface = json.loads(Path("governance/score-public-rights-surface.json").read_text())
          if gate.get("state") != "hold":
              raise SystemExit("Score publication gate is not HOLD")
          if gate.get("decision_receipt") is not None:
              raise SystemExit("Score publication gate has a decision receipt")
          if surface.get("state") != "hold":
              raise SystemExit("Score public rights surface is not HOLD")
          if surface.get("production_change_authorized") is not False:
              raise SystemExit("Production change is unexpectedly authorized")
          PY

      - name: Build provider-free synthetic evidence
        shell: bash
        env:
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          fixture_root="$RUNNER_TEMP/score-private-evidence-synthetic"
          rm -rf "$fixture_root"
          python -m scripts.build_synthetic_private_score_evidence \
            --output-root "$fixture_root" \
            > "$RUNNER_TEMP/synthetic-report.json"

          fixture="$fixture_root/archive/$SYNTHETIC_WEEK/repro_bundle.json"
          test -f "$fixture"
          sha256="$(sha256sum "$fixture" | awk '{print $1}')"
          echo "fixture=$fixture" >> "$GITHUB_ENV"
          echo "fixture_sha256=$sha256" >> "$GITHUB_ENV"

      - name: Request write-bound GitHub OIDC token
        shell: bash
        env:
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          audience="urn:usd-impact:score-private-evidence:write:development:${SYNTHETIC_WEEK}:${fixture_sha256}"
          encoded_audience="$(AUDIENCE="$audience" python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["AUDIENCE"], safe=""))
          PY
          )"

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"

          OIDC_RESPONSE="$oidc_response" python - <<'PY' > "$RUNNER_TEMP/oidc-token.txt"
          import json, os
          value = json.loads(os.environ["OIDC_RESPONSE"]).get("value")
          if not isinstance(value, str) or not value:
              raise SystemExit("missing OIDC token")
          print(value)
          PY
          chmod 600 "$RUNNER_TEMP/oidc-token.txt"

      - name: Write exact synthetic object through broker
        shell: bash
        env:
          BROKER_URL: https://xakayexlzyrazuunqlxe.supabase.co/functions/v1/score-private-evidence-broker
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          oidc_token="$(cat "$RUNNER_TEMP/oidc-token.txt")"
          receipt="$RUNNER_TEMP/score-private-evidence-write-receipt.json"

          curl --fail --silent --show-error \
            -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "Content-Type: application/json" \
            -H "x-score-operation: write" \
            -H "x-score-week: $SYNTHETIC_WEEK" \
            -H "x-score-content-sha256: $fixture_sha256" \
            --data-binary "@$fixture" \
            -o "$receipt"

          unset oidc_token
          rm -f "$RUNNER_TEMP/oidc-token.txt"

          RECEIPT="$receipt" EXPECTED_SHA="$fixture_sha256" python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path(os.environ["RECEIPT"]).read_text())
          if payload.get("schema_version") != "score-private-evidence-broker-receipt-v1":
              raise SystemExit("unexpected broker receipt schema")
          if payload.get("synthetic_rehearsal") is not True:
              raise SystemExit("broker receipt is not synthetic")
          if payload.get("week") != "2099-01-02":
              raise SystemExit("broker receipt week mismatch")
          if payload.get("sha256") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("broker receipt SHA mismatch")
          PY

          {
            echo "### Synthetic private evidence write rehearsal"
            echo
            echo "- week: `2099-01-02`"
            echo "- SHA-256: `$fixture_sha256`"
            echo "- target: Development private broker"
            echo "- provider-derived values: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-temporary evidence
        if: always()
        shell: bash
        run: |
          rm -rf "$RUNNER_TEMP/score-private-evidence-synthetic"
          rm -f \
            "$RUNNER_TEMP/synthetic-report.json" \
            "$RUNNER_TEMP/score-private-evidence-write-receipt.json" \
            "$RUNNER_TEMP/oidc-token.txt"
