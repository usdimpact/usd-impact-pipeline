name: Score WPU0561 v10 offline recovery drill (no restores)

on:
  pull_request:
    branches: [main]
    paths:
      - 'governance/score-v2-1f-bls-wpu0561-2026-source-boundary-review-v10-*'
      - 'governance/score-v2-1f-wpu0561-v10-recovery-manifest.json'
      - 'governance/score-v2-1f-wpu0561-v14-pagecount-forensic-design.json'
      - 'docs/research/score-v2-1f-wpu0561-v14-pagecount-forensic-review.md'
      - 'scripts/score_v2_1f_wpu0561_pdf_v14_offline_diagnostics.py'
      - 'tests/test_score_v2_1f_wpu0561_pdf_v14.py'
      - 'governance/score-v2-1f-wpu0561-v15-methodology-decision.json'
      - 'docs/research/score-v2-1f-wpu0561-v15-methodology-decision-packet.md'
      - 'scripts/score_v2_1f_wpu0561_v15_methodology_guard.py'
      - 'tests/test_score_v2_1f_wpu0561_v15_methodology.py'
      - 'governance/score-v2-1f-wpu0561-v16-owner-option-a-decision.json'
      - 'docs/research/score-v2-1f-wpu0561-v16-option-a-owner-decision.md'
      - 'scripts/score_v2_1f_wpu0561_v16_option_a_guard.py'
      - 'tests/test_score_v2_1f_wpu0561_v16_option_a.py'
      - 'governance/score-v2-1f-bls-wpu0561-pdf-structural-preflight-v11-design.json'
      - 'scripts/validate_score_v2_1f_wpu0561_pdf_v11.py'
      - 'tests/test_score_v2_1f_wpu0561_pdf_v11.py'
      - 'governance/score-v2-1f-bls-wpu0561-pdf-parser-security-v12-design.json'
      - 'governance/score-v2-1f-wpu0561-pdf-v12-parser.lock'
      - 'scripts/score_v2_1f_wpu0561_pdf_v12_synthetic.py'
      - 'tests/test_score_v2_1f_wpu0561_pdf_v12.py'
      - 'governance/score-v2-1f-wpu0561-pdf-v13-owner-decision.json'
      - 'governance/score-v2-1f-wpu0561-pdf-v13-execution-contract.json'
      - 'governance/score-v2-1f-wpu0561-pdf-v13-live-authorization.json'
      - 'governance/score-v2-1f-wpu0561-pdf-v13-dispatch.json'
      - 'governance/score-v2-1f-wpu0561-pdf-v13-consumption-2026-10-29.json'
      - 'scripts/score_v2_1f_wpu0561_pdf_v13_transport.py'
      - 'scripts/score_v2_1f_wpu0561_pdf_v13_parser.py'
      - 'tests/test_score_v2_1f_wpu0561_pdf_v13.py'
      - '.github/workflows/score-v2-1f-wpu0561-pdf-v13-oneoff.yml'
      - 'docs/recovery/score-v2-1f-wpu0561-v10-backup-and-restore.md'
      - 'scripts/validate_score_v2_1f_wpu0561_recovery.py'
      - 'tests/test_score_v2_1f_wpu0561_recovery.py'
      - '.github/workflows/score-v2-1f-wpu0561-recovery-drill.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout unprivileged
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Static and synthetic recovery tests
        run: python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_recovery.py' -v

      - name: Validate v13 scoped approval and mock-only single-request transport (no PDF packages needed)
        run: python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_pdf_v13.py' -v

      - name: Check consumed v13 invariants and invented-only v14 page-count scenarios
        run: |
          python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_pdf_v14.py' -v
          python3 scripts/score_v2_1f_wpu0561_pdf_v14_offline_diagnostics.py

      - name: Validate v15 no-live methodology and invented-only decision cases
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_v15_methodology.py' -v
          python3 -m scripts.score_v2_1f_wpu0561_v15_methodology_guard

      - name: Verify dated v16 owner Option A closure and 42 refusal cases (offline only)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_v16_option_a.py' -v
          python3 -m scripts.score_v2_1f_wpu0561_v16_option_a_guard

      - name: Verify pinned v9 governance state and rehearsal without remote writes
        run: python3 scripts/validate_score_v2_1f_wpu0561_recovery.py --verify-git --drill

      - name: Validate inert v11 PDF preflight and synthetic-only refusal cases
        run: |
          python3 -m unittest discover -s tests -p 'test_score_v2_1f_wpu0561_pdf_v11.py' -v
          python3 scripts/validate_score_v2_1f_wpu0561_pdf_v11.py

      - name: Confirm that this workflow never restores live environments
        run: |
          echo "Recovery drill is offline, read-only on the checked-out repo, and synthetic-only for restore."
          echo "No BLS PDF fetched. No branch/main writes. No release, Score calculation or Production rollback."
          echo "For real recovery: open a separate audited PR from pinned known-good commit (see runbook)."


  isolated-pdf-synthetic-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout reviewed PR code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install only exact hash-pinned pypdf wheel for synthetic testing
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check \
            --require-hashes --no-deps --only-binary=:all: \
            --target "$RUNNER_TEMP/pypdf-v12-synthetic-only" \
            -r governance/score-v2-1f-wpu0561-pdf-v12-parser.lock

      - name: Run generated-fixture-only PDF tests with NO network or cloud credentials
        run: |
          set -euo pipefail
          image="python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3"
          docker pull "$image"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65534,gid=65534 \
            --env PYTHONPATH=/parser:/repo \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/pypdf-v12-synthetic-only:/parser:ro" \
            --workdir /repo \
            "$image" \
            python -m unittest discover \
              -s tests -p 'test_score_v2_1f_wpu0561_pdf_v12.py' -v
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65534,gid=65534 \
            --env PYTHONPATH=/parser:/repo \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/pypdf-v12-synthetic-only:/parser:ro" \
            --workdir /repo \
            "$image" \
            python -m unittest discover \
              -s tests -p 'test_score_v2_1f_wpu0561_pdf_v13.py' -v
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 256m \
            --cpus 1 \
            --user 65534:65534 \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=16m,uid=65534,gid=65534 \
            --env PYTHONPATH=/parser:/repo \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --volume "$RUNNER_TEMP/pypdf-v12-synthetic-only:/parser:ro" \
            --workdir /repo \
            "$image" \
            python -m unittest discover \
              -s tests -p 'test_score_v2_1f_wpu0561_pdf_v14.py' -v

      - name: Confirm no live-PDF input or restore was available
        run: |
          echo "Synthetic pypdf fixtures only. No BLS PDF was fetched, downloaded, parsed or retained."
          echo "Docker parse job had no network, no credential mounts, and read-only repository."
