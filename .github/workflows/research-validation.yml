name: Score v2 research validation

# Research-only robustness publication. This workflow is intentionally separate
# from the core Friday score release so research failures cannot block the
# production score. It publishes descriptive current-vintage validation and an
# explicit as-published-versus-current revision audit.
# A path-scoped push to this established main-branch workflow provides an
# explicit initial dispatch in addition to the scheduled Saturday run.

on:
  schedule:
    - cron: '30 4 * * 6'  # Saturday 04:30 UTC, after weekly score health checks
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/research-validation.yml'
      - 'scripts/score_robustness_battery.py'
      - 'scripts/point_in_time_validation.py'
      - 'scripts/build_vintage_comparison.py'
      - 'usd_impact_score_v2.py'

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: score-v2-research-validation
  cancel-in-progress: false

jobs:
  publish-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Generate live point-in-time and robustness research
        env:
          PYTHONUNBUFFERED: 1
        run: |
          set -o pipefail
          python -m scripts.score_robustness_battery \
            --live \
            --robustness-output public/data/research/score_v2_robustness_latest.json \
            --pit-output public/data/research/score_v2_point_in_time_latest.json \
            2>&1 | tee "$RUNNER_TEMP/score-v2-research.log"
          python -m scripts.build_vintage_comparison \
            --current public/data/usd_impact_score_v2.json \
            --archive-root public/archive \
            --json-output public/data/research/score_v2_vintage_comparison_latest.json \
            --csv-output public/data/research/score_v2_vintage_comparison_latest.csv \
            2>&1 | tee -a "$RUNNER_TEMP/score-v2-research.log"

      - name: Validate research publication contract
        run: |
          set -o pipefail
          python - <<'PY' 2>&1 | tee -a "$RUNNER_TEMP/score-v2-research.log"
          import csv
          import json
          from datetime import date, datetime, timezone
          from pathlib import Path
          import usd_impact_score_v2 as score_v2

          robust_path = Path('public/data/research/score_v2_robustness_latest.json')
          pit_path = Path('public/data/research/score_v2_point_in_time_latest.json')
          vintage_path = Path('public/data/research/score_v2_vintage_comparison_latest.json')
          vintage_csv_path = Path('public/data/research/score_v2_vintage_comparison_latest.csv')
          robust = json.loads(robust_path.read_text(encoding='utf-8'))
          pit = json.loads(pit_path.read_text(encoding='utf-8'))
          vintage = json.loads(vintage_path.read_text(encoding='utf-8'))

          expected_week = score_v2.latest_completed_friday(datetime.now(timezone.utc)).isoformat()
          assert robust['production_methodology_changed'] is False
          assert robust['predictive_claim'] is False
          assert robust['as_published_vintage'] is False
          assert robust['data']['latest_complete_week'] == expected_week
          assert robust['data']['complete_weeks'] >= 52
          assert pit['production_methodology_changed'] is False
          assert pit['predictive_claim'] is False
          assert pit['as_published_vintage'] is False
          assert pit['last_evaluated_week'] == expected_week
          assert pit['evaluated_weeks'] > 0
          assert vintage['production_methodology_changed'] is False
          assert vintage['predictive_claim'] is False
          assert vintage['as_published_vintage'] is True
          assert vintage['difference_definition'] == (
              'current_recalculated_value - as_published_value'
          )
          assert vintage['current_reference']['latest_week'] == expected_week

          vintage_summary = vintage['summary']
          assert vintage_summary['archive_files_scanned'] == (
              vintage_summary['valid_vintages'] + vintage_summary['excluded_archives']
          )
          assert vintage_summary['valid_vintages'] > 0
          assert len(vintage['vintages']) == vintage_summary['valid_vintages']
          assert len(vintage['excluded_archives']) == vintage_summary['excluded_archives']
          assert all(
              date.fromisoformat(row['score_week'])
              <= datetime.fromisoformat(row['published_at_utc']).date()
              for row in vintage['vintages']
          )
          with vintage_csv_path.open(encoding='utf-8', newline='') as handle:
              assert len(list(csv.DictReader(handle))) == vintage_summary['valid_vintages']

          provenance = robust['data']['source_provenance']
          assert isinstance(provenance, dict)
          assert set(provenance) == set(score_v2.WEIGHTS)
          assert all(item['status'] == 'fresh' for item in provenance.values())

          sections = (
              'point_in_time_normalization',
              'leave_one_driver_out',
              'sign_sensitivity',
              'rolling_normalization',
              'correlation_concentration',
              'rolling_component_correlations',
              'contribution_concentration',
              'regime_threshold_sensitivity',
              'score_distribution',
              'regime_duration',
              'subperiod_stability',
          )
          assert all(section in robust for section in sections)
          print(f'Research validation contract passed for {expected_week}.')
          PY

      - name: Report research validation failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          issue_title="Score v2 research validation requires attention"
          body_path="$RUNNER_TEMP/score-v2-research-failure.md"
          log_path="$RUNNER_TEMP/score-v2-research.log"
          {
            echo "## Score v2 research validation failure"
            echo
            echo "The research-only validation workflow failed before a guarded research publication could be merged. The production Weekly USD Impact Score is unaffected."
            echo
            echo "- Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Trigger: ${GITHUB_EVENT_NAME}"
            echo
            echo "### Captured research log tail"
            echo '```text'
            if [ -f "$log_path" ]; then
              tail -n 100 "$log_path"
            else
              echo "No captured research log was produced. Failure occurred before the research generator started."
            fi
            echo '```'
          } > "$body_path"

          issue_number="$(gh issue list \
            --state open \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title == "Score v2 research validation requires attention") | .number' \
            | head -n 1)"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file "$body_path"
            echo "Updated existing research validation issue #${issue_number}."
          else
            gh issue create --title "$issue_title" --body-file "$body_path"
            echo "Opened research validation failure issue."
          fi

      - name: Open, validate, and merge research publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain public/data/research)" ]; then
            echo "No Score v2 research changes to publish."
            exit 0
          fi

          WEEK=$(python -c "import json; print(json.load(open('public/data/research/score_v2_robustness_latest.json'))['data']['latest_complete_week'])")
          branch="automation/score-v2-research-${WEEK}-${GITHUB_RUN_ID}"

          git config user.name "USD Impact Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git checkout -b "$branch"
          git add public/data/research
          git commit -m "Publish Score v2 robustness research for ${WEEK}"
          git push --set-upstream origin "$branch"
          head_sha="$(git rev-parse HEAD)"

          cat > "$RUNNER_TEMP/score-v2-research-pr.md" <<EOF
          ## Automated Score v2 research publication

          This pull request contains current-vintage, research-only validation for **${WEEK}**:

          - expanding-window point-in-time normalization using only prior observations;
          - leave-one-driver-out sensitivity;
          - transmission-sign sensitivity;
          - prior rolling-window normalization sensitivity;
          - input and component-correlation/contribution concentration diagnostics;
          - regime-threshold sensitivity;
          - score-distribution, regime-duration, and subperiod stability summaries; and
          - as-published-versus-current score and component revisions, with invalid legacy archives explicitly reported and excluded.

          These outputs are descriptive, not predictive, and do **not** modify the production Score v2 methodology. The robustness studies use the current recalculated history. The revision audit separately compares each valid archive's declared latest observation with the same week in the current history; it does not identify whether a difference came from expanding-sample normalization or an upstream provider revision.

          Publication is automatic only after the Weekly score quality workflow passes on this exact commit.
          EOF

          pr_url="$(gh pr create \
            --base main \
            --head "$branch" \
            --title "Publish Score v2 robustness research — ${WEEK}" \
            --body-file "$RUNNER_TEMP/score-v2-research-pr.md")"

          gh workflow run quality.yml --ref "$branch"

          run_id=""
          for attempt in $(seq 1 30); do
            run_id="$(gh run list \
              --workflow quality.yml \
              --branch "$branch" \
              --event workflow_dispatch \
              --limit 10 \
              --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"$head_sha\") | .databaseId" | head -n 1)"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "Could not locate the dispatched Weekly score quality run for $head_sha."
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          gh pr merge "$pr_url" --squash --delete-branch
          echo "Merged Score v2 research publication for ${WEEK}."
