name: Weekly score quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Check Python syntax
        run: python -m compileall -q usd_impact_score_v2.py scripts tests

      - name: Validate machine-readable methodology contract
        run: python -m scripts.validate_methodology_contract --json

      - name: Validate machine-readable data semantics contract
        run: python -m scripts.validate_data_semantics_contract --json

      - name: Validate Score v3 metric implementation readiness
        run: python -m scripts.score_v3_metrics --mode readiness

      - name: Test market-data fetch resilience
        run: python -m unittest discover -s tests -v

      - name: Validate weekly release consistency
        run: python scripts/validate_weekly_release.py
