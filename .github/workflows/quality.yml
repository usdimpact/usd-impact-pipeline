name: Weekly score quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runtime/requirements-2026-10-05.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r runtime/requirements-2026-10-05.lock
          python -m pip check

      - name: Set up Node.js for Score security tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Test Score edge security contracts
        run: node --test security/*.test.mjs

      # A single credential-free POST from CI confirms the isolated Development
      # broker has not been accidentally enabled. Never test Production here.
      - name: Confirm Development Score broker remains disabled (anonymous POST)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/score-membership-handoff-147'
        env:
          SCORE_DEV_BROKER_URL: https://ycstrcvshdluovtuasjc.supabase.co/functions/v1/score-preview-broker
        run: |
          set -euo pipefail
          reply="$RUNNER_TEMP/score-dev-broker-disabled.json"
          # No API key, auth cookie, or actual Score token in the request.
          status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 \
            --output "$reply" --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/json' \
            --data '{"action":"validate","token":"AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA"}' \
            "$SCORE_DEV_BROKER_URL")"
          if [ "$status" != '503' ]; then
            echo "::error::Development Score broker returned unexpected HTTP $status; expected disabled 503."
            exit 1
          fi
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(data.allowed!==false || Object.keys(data).length!==1)process.exit(1)' "$reply"
          echo 'Isolated Development broker rejects unauthenticated POST while disabled.'

      # The published branch Preview must not redeem even synthetic tickets.
      # Intentional Preview activation requires a separate reviewed test plan.
      - name: Confirm Cloudflare Score Preview redemption stays disabled
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/score-membership-handoff-147'
        env:
          SCORE_CF_PREVIEW_URL: https://fix-score-membership-handoff.usd-impact-pipeline.pages.dev/score-redeem
        run: |
          set -euo pipefail
          reply="$RUNNER_TEMP/score-cloudflare-disabled.txt"
          status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 \
            --output "$reply" --write-out '%{http_code}' --request POST \
            --header 'Content-Type: application/x-www-form-urlencoded' \
            --data-raw 'ticket=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            "$SCORE_CF_PREVIEW_URL")"
          if [ "$status" != '503' ]; then
            echo "::error::Cloudflare Score Preview redemption unexpectedly returned HTTP $status; expected disabled 503."
            exit 1
          fi
          node -e 'const fs=require("node:fs"); if(fs.readFileSync(process.argv[1],"utf8")!=="Score handoff unavailable") process.exit(1)' "$reply"
          echo 'Cloudflare Score Preview handoff route remains disabled.'


      # Source-locked CI for the dedicated isolated Worker Preview. The Worker and
      # its ASSETS binding must stay fail-closed pending independent membership acceptance.
      # No Cloudflare API tokens, cookies or real entitlement tickets are required.
      - name: Confirm isolated Score Worker Preview stays disabled (GET and POST)
        if: github.event_name == 'pull_request' && github.head_ref == 'fix/score-membership-handoff-147'
        env:
          SCORE_WORKER_PREVIEW_ORIGIN: https://pr-148-usd-impact-score-isolated-dev.michael-w-d0b.workers.dev
        run: |
          set -euo pipefail
          reply="$RUNNER_TEMP/score-worker-preview-denial.txt"
          hdr="$RUNNER_TEMP/score-worker-preview-headers.txt"
          check_denial() {
            local status="$1" path="$2"
            if [ "$status" != '503' ]; then
              echo "::error::Isolated Worker Preview $path returned HTTP $status (expected disabled 503)."
              exit 1
            fi
            if [ "$(cat "$reply")" != 'Score Preview unavailable' ]; then
              echo "::error::Isolated Worker Preview $path returned unexpected disabled response body."
              exit 1
            fi
            if grep -Eiq '^(set-cookie|location):' "$hdr"; then
              echo "::error::Isolated Worker Preview $path set a cookie or redirect while disabled."
              exit 1
            fi
          }
          for path in /en/ /archive/es/ /data/score_v2_methodology.json /data/research/score_v2_point_in_time_latest.json; do
            status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 \
              --dump-header "$hdr" --output "$reply" --write-out '%{http_code}' \
              "$SCORE_WORKER_PREVIEW_ORIGIN$path")"
            check_denial "$status" "GET $path"
          done
          status="$(curl --silent --show-error --connect-timeout 8 --max-time 20 --retry 0 \
            --dump-header "$hdr" --output "$reply" --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/x-www-form-urlencoded' \
            --header 'Origin: https://usd-impact-site-balw49o36-usd-impact.vercel.app' \
            --data-raw 'ticket=AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA' \
            "$SCORE_WORKER_PREVIEW_ORIGIN/score-redeem")"
          check_denial "$status" 'POST /score-redeem'
          echo 'Isolated Worker Preview (including ASSETS perimeter) remains disabled.'

      - name: Check Python syntax
        run: python -m compileall -q usd_impact_score_v2.py scripts tests

      - name: Validate machine-readable methodology contract
        run: python -m scripts.validate_methodology_contract --json

      - name: Validate machine-readable data semantics contract
        run: python -m scripts.validate_data_semantics_contract --json

      - name: Validate Score v3 metric implementation readiness
        run: |
          python -m scripts.verify_score_v3_engine_lock --filesystem-only --json
          python -m scripts.score_v3_metrics --mode readiness

      - name: Validate Score v2 predictive implementation readiness
        run: |
          python -m scripts.verify_score_v2_predictive_engine_lock --filesystem-only --json
          python -m scripts.score_v2_predictive_reporting --mode readiness

      - name: Test market-data fetch resilience
        run: python -m unittest discover -s tests -v

      - name: Validate frozen research container boundary
        run: |
          set -euo pipefail
          wheelhouse="$RUNNER_TEMP/frozen-wheelhouse"
          context="$RUNNER_TEMP/frozen-build-context"
          rm -rf "$wheelhouse" "$context"
          mkdir -p "$wheelhouse" "$context/repo"
          python -m pip download \
            --disable-pip-version-check \
            --only-binary=:all: \
            --dest "$wheelhouse" \
            --requirement requirements.lock
          cp requirements.lock "$context/requirements.lock"
          cp -a "$wheelhouse" "$context/wheelhouse"
          tar --exclude=.git --exclude=.venv --exclude='__pycache__' \
            -cf - . | tar -xf - -C "$context/repo"
          cp runtime/research-worker.Dockerfile "$context/Dockerfile"
          image="usd-impact-frozen-boundary:${GITHUB_RUN_ID}"
          docker pull "python:3.11.15-slim-bookworm@sha256:d29f48a31a8b408ed19272ca1e7b10ebae13b240a27e862d3d4217c528e2e0c3"
          docker build --network=none --pull=false -f "$context/Dockerfile" -t "$image" "$context"
          docker run --rm \
            --network none \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 64 \
            --memory 512m \
            --cpus 1 \
            --entrypoint python \
            "$image" -c '
          import os, socket, urllib3
          assert os.geteuid() != 0
          assert urllib3.__version__ == "2.7.0"
          forbidden = {"GITHUB_TOKEN","GH_TOKEN","ACTIONS_RUNTIME_TOKEN","ACTIONS_ID_TOKEN_REQUEST_TOKEN"}
          assert not (forbidden & set(os.environ))
          try:
              socket.getaddrinfo("example.com", 80)
          except OSError:
              pass
          else:
              raise SystemExit("DNS unexpectedly available")
          for address in (("1.1.1.1", 53), ("127.0.0.1", 80)):
              try:
                  socket.create_connection(address, timeout=0.5)
              except OSError:
                  pass
              else:
                  raise SystemExit(f"network unexpectedly reachable: {address}")
          print("Frozen research container boundary verified.")
          '
          docker image rm --force "$image"

      - name: Validate weekly release consistency
        run: python scripts/validate_weekly_release.py
