name: Python security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/python-security.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - '.github/workflows/python-security.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runtime/requirements-2026-10-05.lock

      - name: Install pinned pip-audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the active online dependency lock
        run: pip-audit --requirement runtime/requirements-2026-10-05.lock

      - name: Generate CycloneDX SBOM evidence
        run: pip-audit --requirement runtime/requirements-2026-10-05.lock --format cyclonedx-json --output "$RUNNER_TEMP/usd-impact-score-python-sbom.cdx.json"

      - name: Validate CycloneDX SBOM evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'usd-impact-score-python-sbom.cdx.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('bomFormat') != 'CycloneDX':
              raise SystemExit('Invalid CycloneDX SBOM: missing bomFormat')
          components = data.get('components')
          if not isinstance(components, list) or not components:
              raise SystemExit('Invalid CycloneDX SBOM: no dependency components')
          print(f'CycloneDX SBOM components: {len(components)}')
          PY

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usd-impact-score-python-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/usd-impact-score-python-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30


  frozen-research-risk:
    name: Frozen research residual dependency risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify isolation policy is still explicit
        run: |
          python -m scripts.execution_environment --json
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('runtime/frozen-research-wheelhouse.json').read_text())
          assert policy['runtime_boundary']['network'] == 'none'
          assert policy['runtime_boundary']['read_only_root'] is True
          assert policy['runtime_boundary']['drop_all_capabilities'] is True
          assert policy['runtime_boundary']['no_new_privileges'] is True
          print('Frozen research isolation policy is explicit.')
          PY

      - name: Install pinned audit tool only
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Surface frozen research dependency findings
        run: |
          echo "The frozen research lock is intentionally audited separately."
          echo "Any vulnerability remains a merge-blocking residual-risk finding until separately accepted."
          pip-audit --requirement requirements.lock

  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, resolved 2026-08-21
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, resolved 2026-08-21
        with:
          category: '/language:python'
