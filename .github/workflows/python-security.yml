name: Python security analysis

on:
  pull_request:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'runtime/requirements-2026-10-05.lock'
      - 'runtime/active-environment.json'
      - 'runtime/frozen-research-wheelhouse.json'
      - 'runtime/research-worker.Dockerfile'
      - '.github/workflows/python-security.yml'
  push:
    branches: [main]
    paths:
      - '**/*.py'
      - 'requirements.txt'
      - 'requirements.lock'
      - 'runtime/requirements-2026-10-05.lock'
      - 'runtime/active-environment.json'
      - 'runtime/frozen-research-wheelhouse.json'
      - 'runtime/research-worker.Dockerfile'
      - '.github/workflows/python-security.yml'
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runtime/requirements-2026-10-05.lock

      - name: Install pinned pip-audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit the active online dependency lock
        run: pip-audit --requirement runtime/requirements-2026-10-05.lock

      - name: Generate CycloneDX SBOM evidence
        run: pip-audit --requirement runtime/requirements-2026-10-05.lock --format cyclonedx-json --output "$RUNNER_TEMP/usd-impact-score-python-sbom.cdx.json"

      - name: Validate CycloneDX SBOM evidence
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ['RUNNER_TEMP']) / 'usd-impact-score-python-sbom.cdx.json'
          data = json.loads(path.read_text(encoding='utf-8'))
          if data.get('bomFormat') != 'CycloneDX':
              raise SystemExit('Invalid CycloneDX SBOM: missing bomFormat')
          components = data.get('components')
          if not isinstance(components, list) or not components:
              raise SystemExit('Invalid CycloneDX SBOM: no dependency components')
          print(f'CycloneDX SBOM components: {len(components)}')
          PY

      - name: Upload SBOM evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usd-impact-score-python-sbom-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/usd-impact-score-python-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30


  frozen-research-risk:
    name: Frozen research residual dependency risk
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify isolation policy is still explicit
        run: |
          python -m scripts.execution_environment --json
          python - <<'PY'
          import json
          from pathlib import Path
          policy = json.loads(Path('runtime/frozen-research-wheelhouse.json').read_text())
          assert policy['runtime_boundary']['network'] == 'none'
          assert policy['runtime_boundary']['read_only_root'] is True
          assert policy['runtime_boundary']['drop_all_capabilities'] is True
          assert policy['runtime_boundary']['no_new_privileges'] is True
          print('Frozen research isolation policy is explicit.')
          PY

      - name: Install pinned audit tool only
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Verify residual-risk acceptance is current and scoped
        run: |
          python - <<'PY'
          import datetime as dt
          import hashlib
          from pathlib import Path

          accepted_until = dt.date.fromisoformat("2026-11-05")
          if dt.datetime.now(dt.timezone.utc).date() > accepted_until:
              raise SystemExit(
                  "Frozen research residual-risk acceptance expired; fresh review is required."
              )

          lock = Path("requirements.lock")
          expected_lock = "a4c6fb90909a04eb267057d3e31049c7fc38b12e8a7d556e79c0141aa0d52db6"
          actual_lock = hashlib.sha256(lock.read_bytes()).hexdigest()
          if actual_lock != expected_lock:
              raise SystemExit("Frozen research lock changed; residual-risk acceptance is invalid.")

          print(f"Residual-risk acceptance is current through {accepted_until.isoformat()}.")
          print(f"Frozen research lock SHA-256: {actual_lock}")
          PY

      - name: Audit and exact-match accepted frozen findings
        run: |
          audit_rc=0
          pip-audit \
            --requirement requirements.lock \
            --format json \
            --output "$RUNNER_TEMP/frozen-research-audit.json" || audit_rc=$?

          if [ "$audit_rc" -ne 1 ]; then
            echo "Expected pip-audit exit code 1 for the reviewed frozen findings; got $audit_rc."
            echo "A changed finding state requires fresh review."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "frozen-research-audit.json"
          if not path.is_file():
              raise SystemExit("Frozen research audit JSON was not produced.")

          payload = json.loads(path.read_text(encoding="utf-8"))
          if isinstance(payload, dict):
              dependencies = payload.get("dependencies")
          elif isinstance(payload, list):
              dependencies = payload
          else:
              dependencies = None

          if not isinstance(dependencies, list):
              raise SystemExit("Unexpected pip-audit JSON schema.")

          expected = {
              ("urllib3", "2.7.0", "PYSEC-2026-4175"),
              ("urllib3", "2.7.0", "PYSEC-2026-4176"),
              ("urllib3", "2.7.0", "PYSEC-2026-4177"),
          }
          found = set()
          reviewed_fix = "2.8.0"

          for dependency in dependencies:
              if not isinstance(dependency, dict):
                  raise SystemExit("Unexpected dependency entry in pip-audit JSON.")
              name = str(dependency.get("name", "")).lower()
              version = str(dependency.get("version", ""))
              vulns = dependency.get("vulns") or []
              if not isinstance(vulns, list):
                  raise SystemExit("Unexpected vulnerability list in pip-audit JSON.")
              for vuln in vulns:
                  if not isinstance(vuln, dict):
                      raise SystemExit("Unexpected vulnerability entry in pip-audit JSON.")
                  vuln_id = str(vuln.get("id", ""))
                  found.add((name, version, vuln_id))
                  fixes = vuln.get("fix_versions") or []
                  if (name, version, vuln_id) in expected and reviewed_fix not in fixes:
                      raise SystemExit(
                          f"Reviewed finding {vuln_id} no longer reports expected fix {reviewed_fix}."
                      )

          if found != expected:
              missing = sorted(expected - found)
              unexpected = sorted(found - expected)
              raise SystemExit(
                  "Frozen research finding set changed; fresh review required. "
                  f"Missing={missing}; unexpected={unexpected}"
              )

          print("Accepted frozen residual-risk set matched exactly:")
          for item in sorted(found):
              print(f"- {item[0]} {item[1]} {item[2]}")
          print("No other frozen dependency findings were accepted.")
          PY

      - name: Retain frozen residual-risk audit evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: usd-impact-frozen-research-risk-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/frozen-research-audit.json
          if-no-files-found: error
          retention-days: 30

  codeql:
    name: CodeQL (python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, resolved 2026-08-21
        with:
          languages: python
          queries: security-extended

      - name: Analyze Python
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4, resolved 2026-08-21
        with:
          category: '/language:python'
