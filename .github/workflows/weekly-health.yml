name: Weekly USD Impact Health

# Runs after the Friday score/commentary release has had time to deploy.
# Manual runs are available from the Actions tab for verification.
on:
  schedule:
    - cron: '0 2 * * 6'  # Saturday 02:00 UTC
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: weekly-usd-impact-health
  cancel-in-progress: false

jobs:
  verify-weekly-release:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check workflow, data, and dashboards
        id: health
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/check_weekly_health.py \
            --repo "$GITHUB_REPOSITORY" \
            --workflow weekly.yml \
            --branch main \
            --base-url https://usd-impact-pipeline.pages.dev \
            --max-run-age-hours 36 \
            --report weekly-health-report.md

      - name: Open or update health issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Weekly USD Impact pipeline requires attention
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file weekly-health-report.md
            echo "Updated issue #$ISSUE_NUMBER"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file weekly-health-report.md
          fi

      - name: Close recovered health issue
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: Weekly USD Impact pipeline requires attention
        run: |
          ISSUE_NUMBER=$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "in:title $ISSUE_TITLE" \
            --json number \
            --jq '.[0].number // empty')

          if [ -n "$ISSUE_NUMBER" ]; then
            {
              echo "## Recovery confirmed"
              echo
              echo "The scheduled health check is passing again."
              echo
              cat weekly-health-report.md
            } > weekly-health-recovery.md
            gh issue comment "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --body-file weekly-health-recovery.md
            gh issue close "$ISSUE_NUMBER" \
              --repo "$GITHUB_REPOSITORY" \
              --reason completed
            echo "Closed recovered issue #$ISSUE_NUMBER"
          else
            echo "No open health issue to close"
          fi

      - name: Fail when health checks fail
        if: steps.health.outcome == 'failure'
        run: |
          echo "Weekly USD Impact health checks failed. See the generated issue and report above."
          exit 1
