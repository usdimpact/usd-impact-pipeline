name: Score v2.1F BLS WPU0561 candidate-local header-gap inventory v7

on:
  push:
    branches: [main]
    paths:
      - 'governance/score-v2-1f-bls-wpu0561-ambiguity-diagnostics-preflight-dispatch.json'

permissions:
  contents: read

concurrency:
  group: score-v2-1f-bls-wpu0561-header-gap-v7
  cancel-in-progress: false

jobs:
  header-gap-inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run owner-authorized v7 header-gap inventory
        run: |
          python -m scripts.run_score_v2_1f_bls_wpu0561_ambiguity_diagnostics_preflight
