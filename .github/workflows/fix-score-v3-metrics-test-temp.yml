name: TEMP fix Score v3 metrics test mock

on:
  pull_request:
    branches: [main]
    paths:
      - tests/test_score_v3_metrics.py
      - .github/workflows/fix-score-v3-metrics-test-temp.yml

permissions:
  contents: write

jobs:
  fix-test-mock:
    if: github.head_ref == 'agent/score-v3-metric-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Score v3 metric branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/score-v3-metric-contract
          fetch-depth: 0

      - name: Replace shared mutable bootstrap mock
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/test_score_v3_metrics.py')
          text = path.read_text(encoding='utf-8')
          old = 'candidate_bootstrap=patch.object(metrics, "candidate_bootstrap", return_value=_history()),'
          new = 'candidate_bootstrap=patch.object(metrics, "candidate_bootstrap", side_effect=lambda _root, _candidate_id: _history()),'
          old_count = text.count(old)
          new_count = text.count(new)
          if old_count == 1 and new_count == 0:
              path.write_text(text.replace(old, new), encoding='utf-8')
          elif old_count == 0 and new_count == 1:
              print('Test mock is already fixed; no change needed.')
          else:
              raise SystemExit(f'Unexpected replacement counts: old={old_count}, new={new_count}')
          PY

      - name: Commit test-only correction when needed
        run: |
          if git diff --quiet; then
            echo "No change to commit."
            exit 0
          fi
          changed="$(git diff --name-only)"
          test "$changed" = "tests/test_score_v3_metrics.py" || {
            echo "Unexpected modified paths:"
            echo "$changed"
            exit 1
          }
          git config user.name "USD Impact Research Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git add tests/test_score_v3_metrics.py
          git commit -m "Fix Score v3 future-append test isolation"
          git push origin HEAD:agent/score-v3-metric-contract
