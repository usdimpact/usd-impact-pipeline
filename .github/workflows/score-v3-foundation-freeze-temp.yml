name: TEMP Score v3 initialization freeze

on:
  push:
    branches: [agent/score-v3-foundation]
    paths:
      - research/score_v3_freeze_request.json

permissions:
  contents: write

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout foundation branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: agent/score-v3-foundation
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Freeze retrospective initialization matrix
        run: |
          python -m scripts.freeze_score_v3_initialization \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --generator-commit "$GITHUB_SHA"

      - name: Verify frozen artifact locally
        run: python -m scripts.freeze_score_v3_initialization --verify-frozen

      - name: Generate structural readiness report only
        run: |
          python -m scripts.score_v3_candidates \
            --weekly-levels research/score_v3_initialization_2026-08-21.csv \
            --readiness-output research/score_v3_foundation_readiness.json >/tmp/score-v3-readiness.log
          cat /tmp/score-v3-readiness.log

      - name: Commit frozen research artifacts to foundation branch
        run: |
          git config user.name "usd-impact-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add \
            research/score_v3_initialization_2026-08-21.csv \
            research/score_v3_initialization_2026-08-21.manifest.json \
            research/score_v3_foundation_readiness.json
          if git diff --cached --quiet; then
            echo "No generated freeze artifacts to commit"
            exit 0
          fi
          git commit -m "Freeze Score v3 retrospective initialization through 2026-08-21"
          git push origin HEAD:agent/score-v3-foundation
