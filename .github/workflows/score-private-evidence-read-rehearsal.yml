name: Score private evidence synthetic read rehearsal

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: score-private-evidence-synthetic-read
  cancel-in-progress: false

jobs:
  synthetic-read:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout reviewed main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runtime/requirements-2026-10-05.lock

      - name: Install pinned runtime dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r runtime/requirements-2026-10-05.lock
          python -m pip check

      - name: Confirm rights HOLD remains active
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          gate = json.loads(Path("governance/score-publication-rights-gate.json").read_text())
          surface = json.loads(Path("governance/score-public-rights-surface.json").read_text())
          migration = json.loads(Path("governance/score-private-research-migration-contract.json").read_text())
          if gate.get("state") != "hold":
              raise SystemExit("Score publication gate is not HOLD")
          if gate.get("decision_receipt") is not None:
              raise SystemExit("Score publication gate has a decision receipt")
          if surface.get("state") != "hold":
              raise SystemExit("Score public rights surface is not HOLD")
          if surface.get("production_change_authorized") is not False:
              raise SystemExit("Production change is unexpectedly authorized")
          if migration.get("state") != "review_only":
              raise SystemExit("private research migration contract is not review-only")
          if migration.get("development_synthetic_rehearsal_authorized") is not True:
              raise SystemExit("Development synthetic rehearsal is not authorized")
          if migration.get("real_provider_evidence_authorized") is not False:
              raise SystemExit("real provider evidence is unexpectedly authorized")
          if migration.get("public_replacement_authorized") is not False:
              raise SystemExit("public replacement is unexpectedly authorized")
          PY

      - name: Request week-bound GitHub OIDC token
        shell: bash
        env:
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          audience="urn:usd-impact:score-private-evidence:read:development:${SYNTHETIC_WEEK}"
          encoded_audience="$(AUDIENCE="$audience" python - <<'PY'
          import os, urllib.parse
          print(urllib.parse.quote(os.environ["AUDIENCE"], safe=""))
          PY
          )"

          oidc_response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${encoded_audience}")"

          OIDC_RESPONSE="$oidc_response" python - <<'PY' > "$RUNNER_TEMP/oidc-token.txt"
          import json, os
          value = json.loads(os.environ["OIDC_RESPONSE"]).get("value")
          if not isinstance(value, str) or not value:
              raise SystemExit("missing OIDC token")
          print(value)
          PY
          chmod 600 "$RUNNER_TEMP/oidc-token.txt"

      - name: Read and validate exact synthetic object
        shell: bash
        env:
          BROKER_URL: https://xakayexlzyrazuunqlxe.supabase.co/functions/v1/score-private-evidence-broker
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          oidc_token="$(cat "$RUNNER_TEMP/oidc-token.txt")"
          output="$RUNNER_TEMP/repro_bundle.json"
          headers="$RUNNER_TEMP/headers.txt"

          curl --fail --silent --show-error \
            -X POST "$BROKER_URL" \
            -H "Authorization: Bearer $oidc_token" \
            -H "x-score-operation: read" \
            -H "x-score-week: $SYNTHETIC_WEEK" \
            -D "$headers" \
            -o "$output"

          unset oidc_token
          rm -f "$RUNNER_TEMP/oidc-token.txt"

          expected_sha="$(awk 'BEGIN{IGNORECASE=1} /^x-score-content-sha256:/ {gsub("\r","",$2); print $2}' "$headers")"
          actual_sha="$(sha256sum "$output" | awk '{print $1}')"
          test -n "$expected_sha"
          test "$actual_sha" = "$expected_sha"

          OUTPUT="$output" python - <<'PY'
          import json, os
          from pathlib import Path

          payload = json.loads(Path(os.environ["OUTPUT"]).read_text())
          if payload.get("synthetic_rehearsal") is not True:
              raise SystemExit("stored bundle is not synthetic")
          if payload.get("do_not_publish") is not True:
              raise SystemExit("stored bundle lacks do-not-publish marker")
          if payload.get("score_week") != "2099-01-02":
              raise SystemExit("stored bundle week mismatch")
          if payload.get("pipeline_git_sha") != "0" * 40:
              raise SystemExit("stored bundle has non-synthetic pipeline SHA")
          if payload.get("requirements_lock_sha256") != "0" * 64:
              raise SystemExit("stored bundle has non-synthetic requirements hash")
          PY

          {
            echo "### Synthetic private evidence read rehearsal"
            echo
            echo "- week: 2099-01-02"
            echo "- SHA-256: $actual_sha"
            echo "- source: Development private broker"
            echo "- provider-derived values: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate private research adapter and aggregate-safe view
        shell: bash
        env:
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/private-research-migration-report.json"
          python -m scripts.validate_score_private_research_migration_bundle \
            --repo-root . \
            --bundle "$RUNNER_TEMP/repro_bundle.json" \
            --expected-week "$SYNTHETIC_WEEK" \
            --report-output "$report"

          REPORT="$report" python - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT"]).read_text())
          if report.get("status") != "passed":
              raise SystemExit("private research migration validation did not pass")
          if report.get("private_component_values_exposed_publicly") is not False:
              raise SystemExit("private component leakage detected")
          if report.get("production_change_authorized") is not False:
              raise SystemExit("Production change unexpectedly authorized")
          if report.get("real_provider_evidence_authorized") is not False:
              raise SystemExit("real provider evidence unexpectedly authorized")
          if report.get("public_replacement_authorized") is not False:
              raise SystemExit("public replacement unexpectedly authorized")
          PY

          {
            echo "### Private research adapter validation"
            echo
            echo "- source: authorized Development read workflow"
            echo "- provider-derived real evidence: false"
            echo "- public replacement: false"
            echo "- Production change: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate locked reader compatibility from private bundle
        shell: bash
        env:
          SYNTHETIC_WEEK: '2099-01-02'
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/private-reader-compatibility-report.json"
          python -m scripts.rehearse_score_private_reader_compatibility \
            --bundle "$RUNNER_TEMP/repro_bundle.json" \
            --expected-week "$SYNTHETIC_WEEK" \
            --report-output "$report"

          expected_sha="$(sha256sum "$RUNNER_TEMP/repro_bundle.json" | awk '{print $1}')"
          REPORT="$report" EXPECTED_SHA="$expected_sha" python - <<'PY'
          import json, os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT"]).read_text())
          if report.get("status") != "passed":
              raise SystemExit("locked reader compatibility validation did not pass")
          if report.get("bundle_sha256") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("locked reader compatibility SHA mismatch")
          for field in ("predictive_score_equal", "predictive_dxy_equal", "v3_source_levels_equal"):
              if report.get(field) is not True:
                  raise SystemExit(f"locked reader compatibility mismatch: {field}")
          if report.get("v3_driver_count") != 8:
              raise SystemExit("locked V3 driver count mismatch")
          if report.get("repository_public_paths_modified") is not False:
              raise SystemExit("repository public paths were unexpectedly modified")
          if report.get("locked_readers_modified") is not False:
              raise SystemExit("locked readers were unexpectedly modified")
          PY

          {
            echo "### Locked reader private-bundle compatibility"
            echo
            echo "- legacy materialization: runner-temporary only"
            echo "- predictive Score/DXY equality: true"
            echo "- V3 source-level equality: true"
            echo "- locked readers modified: false"
            echo "- repository public paths modified: false"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove runner-temporary evidence
        if: always()
        shell: bash
        run: |
          rm -f \
            "$RUNNER_TEMP/repro_bundle.json" \
            "$RUNNER_TEMP/headers.txt" \
            "$RUNNER_TEMP/private-research-migration-report.json" \
            "$RUNNER_TEMP/private-reader-compatibility-report.json" \
            "$RUNNER_TEMP/oidc-token.txt"
