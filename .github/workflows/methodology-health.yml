name: Score methodology public health

on:
  schedule:
    - cron: '15 2 * * 6'  # Saturday 02:15 UTC, after weekly release health
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: score-methodology-public-health
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install locked dependencies
        run: |
          python -m pip install --upgrade pip==26.2.1
          python -m pip install -r requirements.lock
          python -m pip check

      - name: Verify checked-in methodology still matches production code
        run: python -m scripts.validate_methodology_contract --json

      - name: Check public methodology artifacts and links
        id: health
        continue-on-error: true
        run: |
          python -m scripts.check_score_methodology_health \
            --pipeline-base https://usd-impact-pipeline.pages.dev \
            --site-page https://www.usd-impact.com/score/methodology/ \
            --report score-methodology-health-report.md

      - name: Open or update methodology health issue
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Score methodology public health requires attention
        run: |
          issue="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body-file score-methodology-health-report.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file score-methodology-health-report.md
          fi

      - name: Close recovered methodology health issue
        if: steps.health.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_TITLE: Score methodology public health requires attention
        run: |
          issue="$(gh issue list --state open --limit 100 --json number,title --jq ".[] | select(.title == \"$ISSUE_TITLE\") | .number" | head -n 1)"
          if [ -n "$issue" ]; then
            {
              echo "## Recovery confirmed"
              echo
              cat score-methodology-health-report.md
            } > score-methodology-health-recovery.md
            gh issue comment "$issue" --body-file score-methodology-health-recovery.md
            gh issue close "$issue" --reason completed
          else
            echo "No open methodology health issue to close."
          fi

      - name: Fail when public methodology health is unhealthy
        if: steps.health.outcome == 'failure'
        run: exit 1
