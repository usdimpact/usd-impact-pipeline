# One-off PR #339 dependency advisory evidence only.
# NO market/provider inputs, frozen package installation, security waiver or publication.
name: Frozen package advisory evidence (PR339 read-only)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - '.github/workflows/frozen-advisory-readonly-snapshot-pr339.yml'

permissions:
  contents: read

jobs:
  pinned-advisory-snapshot:
    name: Read-only advisory scan, unaccepted findings
    if: ${{ github.event.pull_request.number == 339 && github.event.pull_request.head.repo.full_name == 'usdimpact/usd-impact-pipeline' && github.event.pull_request.head.ref == 'agent/frozen-research-risk-review-packet-20261107' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out exact PR head only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Prepare isolated audit tooling
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          cache: ''

      - name: Verify immutable lock and canonical publication hold
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          lock = Path("requirements.lock").read_bytes()
          actual = hashlib.sha256(lock).hexdigest()
          expected = "a4c6fb90909a04eb267057d3e31049c7fc38b12e8a7d556e79c0141aa0d52db6"
          if actual != expected:
              raise SystemExit("STOP: frozen lock digest changed")
          pins = [
              line.strip() for line in lock.decode("utf-8").splitlines()
              if line.strip() and not line.startswith("#")
          ]
          if len(pins) != 31 or len({p.split("==")[0] for p in pins}) != 31:
              raise SystemExit("STOP: unexpected exact pin inventory")
          if any(pin.count("==") != 1 for pin in pins):
              raise SystemExit("STOP: not all frozen pins exact")
          if not {"pillow==12.3.0", "certifi==2026.7.22", "urllib3==2.7.0"}.issubset(pins):
              raise SystemExit("STOP: expected frozen pin identity mismatch")
          hold = json.loads(Path("governance/score-publication-rights-gate.json").read_text())
          if hold.get("state") != "hold" or hold.get("decision_receipt") is not None or hold.get("approved_by") is not None:
              raise SystemExit("STOP: original Score rights hold unexpectedly changed")
          print("EVIDENCE_ONLY: 31 pinned packages, lock sha256=" + actual)
          print("RIGHTS_HOLD: observed, not modified. No frozen dependencies will be installed.")
          PY

      - name: Install auditor only (never install audited frozen packages)
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pip-audit==2.10.1
          pip-audit --version

      - name: Fetch independent pinned-PyPI and OSV advisory snapshots
        shell: bash
        run: |
          set +e
          pip-audit --no-deps --disable-pip --vulnerability-service pypi --requirement requirements.lock --format json --output "$RUNNER_TEMP/frozen-audit-pypi.json"
          pypi_status=$?
          pip-audit --no-deps --disable-pip --vulnerability-service osv --requirement requirements.lock --format json --output "$RUNNER_TEMP/frozen-audit-osv.json"
          osv_status=$?
          set -e
          echo "PYPI_STATUS=$pypi_status" >> "$GITHUB_ENV"
          echo "OSV_STATUS=$osv_status" >> "$GITHUB_ENV"
          if [ "$pypi_status" -gt 1 ] || [ "$osv_status" -gt 1 ]; then
            echo "STOP: auditor error. Findings were not accepted." >&2
            exit 1
          fi
          test -s "$RUNNER_TEMP/frozen-audit-pypi.json"
          test -s "$RUNNER_TEMP/frozen-audit-osv.json"

      - name: Compare raw advisory IDs and fix versions without accepting risk
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import collections
          import datetime
          import hashlib
          import json
          import os
          from pathlib import Path

          lines = Path(".github/workflows/python-security.yml").read_text(encoding="utf-8").splitlines()
          def literal_assignment(key):
              marker = key + " = {"
              start = next((i for i, line in enumerate(lines) if line.strip() == marker), None)
              if start is None:
                  raise SystemExit("STOP: existing security " + key + " missing")
              end = next((i for i in range(start + 1, len(lines)) if lines[i].strip() == "}"), None)
              if end is None:
                  raise SystemExit("STOP: existing security " + key + " truncated")
              body = "\n".join(line.strip() for line in lines[start:end + 1]).split("=", 1)[1].strip()
              return ast.literal_eval(body)
          old_expected = literal_assignment("expected")
          known_aliases = literal_assignment("advisory_aliases")
          if len(old_expected) != 43:
              raise SystemExit("STOP: historic accepted tuple count drift")
          manifest = {p.split("==")[0].replace("_", "-").lower(): p.split("==")[1]
                      for p in Path("requirements.lock").read_text().splitlines()
                      if p and not p.startswith("#")}
          if len(manifest) != 31:
              raise SystemExit("STOP: frozen inventory drift")
          now = datetime.datetime.now(datetime.timezone.utc).isoformat()
          report_lines = ["# Read-only frozen dependency advisory snapshot",
                          "", "- UTC scanned: " + now,
                          "- Lock SHA-256: " + hashlib.sha256(Path("requirements.lock").read_bytes()).hexdigest(),
                          "- Auditor: pip-audit 2.10.1",
                          "- Independent feeds: PyPI, OSV",
                          "- 31 frozen pinned packages; ZERO frozen packages installed",
                          "- No acceptance, waiver, publisher rights, secrets or new Score edition",
                          ""]
          evidence_failed = False
          for channel in ("pypi", "osv"):
              rawpath = Path(os.environ["RUNNER_TEMP"]) / ("frozen-audit-" + channel + ".json")
              raw = rawpath.read_bytes()
              payload = json.loads(raw)
              deps = payload.get("dependencies") if isinstance(payload, dict) else payload
              if not isinstance(deps, list):
                  raise SystemExit("STOP: unsupported " + channel + " audit JSON")
              seen_names = set()
              raw_findings = {}
              for dep in deps:
                  name = str(dep["name"]).replace("_", "-").lower()
                  ver = str(dep["version"])
                  if name not in manifest or manifest[name] != ver or name in seen_names:
                      raise SystemExit("STOP: " + channel + " audited an unexpected package/version")
                  seen_names.add(name)
                  for vuln in dep.get("vulns") or []:
                      vid = str(vuln["id"])
                      fixes = tuple(sorted(str(x) for x in (vuln.get("fix_versions") or [])))
                      raw_findings[(name, ver, vid)] = fixes
              if seen_names != set(manifest):
                  raise SystemExit("STOP: " + channel + " did not cover all 31 pins")
              observed = {(n, v, known_aliases.get(ident, ident))
                          for n, v, ident in raw_findings}
              new = sorted(observed - old_expected)
              missing = sorted(old_expected - observed)
              by_package = dict(collections.Counter(n for n, _, _ in observed))
              uncaptured = not any("112902" in ident or "xvh5-g6gv-559v" in ident.lower()
                                   for _, _, ident in raw_findings)
              print("AUDIT_FEED", channel, "scan_utc", now)
              print("RAW_EVIDENCE_SHA256", channel, hashlib.sha256(raw).hexdigest())
              print("AFFECTED_COUNTS", channel, json.dumps(by_package, sort_keys=True))
              print("FINDING_DELTA", channel, "new", len(new), "missing", len(missing),
                    "unobserved_known_pillow_advisory", uncaptured)
              for entry in new:
                  print("UNREVIEWED_FINDING", channel, " ".join(entry))
              for entry in missing:
                  print("PREVIOUSLY_ACCEPTED_TUPLE_NOT_REPORTED", channel, " ".join(entry))
              for (name, ver, vid), fixes in sorted(raw_findings.items()):
                  print("RAW_AUDIT_FINDING", channel, name, ver, vid, "fixes=" + ",".join(fixes))
              report_lines += ["## " + channel.upper(), "",
                               "- Raw JSON SHA-256 (ephemeral only): " + hashlib.sha256(raw).hexdigest(),
                               "- Findings: " + str(len(observed)),
                               "- New vs existing normalized list: " + str(len(new)),
                               "- Missing vs existing normalized list: " + str(len(missing)),
                               "- Pillow advisory ID in this feed: " + ("not reported" if uncaptured else "reported"),
                               "- Advisory snapshot: review required, never auto-accepted", ""]
              if new or missing or uncaptured:
                  evidence_failed = True
          Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8").write("\n".join(report_lines) + "\n")
          if evidence_failed:
              raise SystemExit("FAIL-CLOSED: new/missing advisory or known feed coverage gap requires fresh human review; no risk is accepted")
          print("COMPARE_ONLY: all reported IDs matched historical set, but expired acceptance remains DENY.")
          PY

      - name: Explicit non-release verdict
        if: always()
        shell: bash
        run: |
          echo "This is advisory evidence only. Do not merge Draft #339, renew the expired 2026-11-05 acceptance, alter frozen research or lift Score publishing holds."
          echo "Raw auditor JSON remained in ephemeral RUNNER_TEMP, was not uploaded, and will be destroyed with this runner."
