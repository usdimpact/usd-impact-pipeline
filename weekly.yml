name: Weekly USD Impact Score

# Runs the pipeline every Friday at 22:00 UTC (after US market close),
# commits the updated dashboard back to the repo. Cloudflare Pages
# auto-deploys on push.
#
# Manual runs: Actions tab → Weekly USD Impact Score → Run workflow.

on:
  schedule:
    - cron: '0 22 * * 5'  # Friday 22:00 UTC
  workflow_dispatch:       # allow manual trigger from Actions tab

permissions:
  contents: write          # needed to commit updated dashboard

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline (web mode, with backtest)
        env:
          PYTHONUNBUFFERED: 1
        run: |
          python usd_impact_score_v2.py --web --output-dir public --backtest

      - name: Show latest score
        run: |
          python -c "
          import json
          with open('public/data/usd_impact_score_v2.json') as f:
              meta = json.load(f)['metadata']
          print(f\"Latest score: {meta['latest_score']:+.3f}\")
          print(f\"Latest regime: {meta['latest_regime']}\")
          print(f\"As of: {meta['latest_date']}\")
          print(f\"Total weeks: {meta['n_weeks']}\")
          "

      - name: Archive weekly snapshot
        run: |
          WEEK=$(date -u +'%Y-%m-%d')
          mkdir -p public/archive/$WEEK
          cp public/en/index.html public/archive/$WEEK/en.html || true
          cp public/es/index.html public/archive/$WEEK/es.html || true
          cp public/data/usd_impact_score_v2.json public/archive/$WEEK/score.json || true
          echo "Archived snapshot to public/archive/$WEEK/"

      - name: Commit and push updated dashboard
        run: |
          git config user.name "USD Impact Pipeline"
          git config user.email "pipeline@lbx-fx.com"
          git add public/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            WEEK=$(date -u +'%Y-%m-%d')
            git commit -m "Weekly score update — $WEEK"
            git push
            echo "Pushed weekly update for $WEEK"
          fi
